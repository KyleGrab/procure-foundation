services:
  # Note on RLS: there is no Postgres/Docker setting that "enables RLS" at the container level.
  # Row-Level Security is per-table DDL (ALTER TABLE ... ENABLE ROW LEVEL SECURITY) applied by
  # the Alembic migrations themselves - see backend/alembic/versions/0001-0003 and ADR-003. This
  # plain pgvector/pgvector image is correct; `alembic upgrade head` is what actually turns RLS on.
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: procureiq
      POSTGRES_PASSWORD: procureiq
      POSTGRES_DB: procureiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procureiq"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ./backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.tasks.celery_app worker --loglevel=info
    profiles: ["phase3+"]  # not started by default until Phase 3 introduces Celery — see ADR-002

  frontend:
    build: ./frontend
    env_file: .env
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
  minio_data:
