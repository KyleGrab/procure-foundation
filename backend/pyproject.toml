[project]
name = "procureiq-backend"
version = "0.1.0"
description = "ProcureIQ backend - procurement intelligence platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "redis>=5.2",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "black>=24.10",
    "testcontainers[postgres]>=4.8",  # backend/tests/test_rls_integration.py - see ADR-011
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    """integration: requires a real, live PostgreSQL database - never runs against SQLite/mocks. \
    Excluded from a normal run with `-m "not integration"`; run for real with `-m integration` \
    once a disposable database is available. Not skipped unconditionally - a run that doesn't \
    explicitly filter these out will show them as failing/erroring, not silently absent.""",
]
