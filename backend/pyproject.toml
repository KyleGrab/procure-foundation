[project]
name = "procureiq-backend"
version = "0.1.0"
description = "ProcureIQ backend - procurement intelligence platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "greenlet>=3.1",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "redis>=5.2",
    "python-multipart>=0.0.12",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff==0.16.6",
    "mypy>=1.13",
    "black>=24.10",
    "testcontainers[postgres]>=4.8",  # backend/tests/test_rls_integration.py - see ADR-011
]
# AI-PROVIDER-RESILIENCE-R1: optional, not a base dependency - app/ai/llm_provider.py's
# AnthropicProvider imports this lazily, only when a real completion is actually attempted (never
# at app startup, never before the ACCESS_AI permission check). An environment that never intends
# to serve real Copilot/negotiation-brief traffic through the Anthropic provider needs nothing
# here; one that does must install this extra explicitly (`pip install -e ".[ai]"`), or every
# authorised AI request fails closed with a structured 503 (LLMProviderUnavailableError) instead
# of the SDK simply not existing. 0.34.0 is the minimum version confirmed to support the exact
# shape this provider calls - AsyncAnthropic, client.messages.create(model=, max_tokens=, system=,
# messages=[...]), and response.content blocks carrying .type/.text - not "latest", which this
# sandbox has no way to verify without a live index lookup.
ai = [
    "anthropic>=0.34.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "app.core.permissions.require_permission",
]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Without an explicit loop scope, pytest-asyncio defaults to a fresh event loop per test
# function. tests/conftest.py's session-scoped `_prepare_schema` fixture (and the process-wide
# `app.db.session._engine` created at import time) both outlive any single test's loop, so their
# pooled asyncpg connections end up bound to a loop that a later test's fresh loop has already
# closed - "Task ... attached to a different loop". Session-scoping the loop itself (test-only;
# does not touch app/db/session.py's engine/session architecture) makes the loop's lifetime match
# what these fixtures already assume.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    """integration: requires a real, live PostgreSQL database - never runs against SQLite/mocks. \
    Excluded from a normal run with `-m "not integration"`; run for real with `-m integration` \
    once a disposable database is available. Not skipped unconditionally - a run that doesn't \
    explicitly filter these out will show them as failing/erroring, not silently absent.""",
]
